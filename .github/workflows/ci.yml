name: CI

on:
  push:
  pull_request:

jobs:
  static-checks:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Python
        run: pacman -Syu --noconfirm python
      - name: Python syntax
        run: python -m py_compile bottles-retro-cd-gui.py cdemu_backend.py sandbox_backend.py gpu_backend.py settings_backend.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Shell syntax
        run: bash -n run-local.sh
