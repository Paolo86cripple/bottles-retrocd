name: CI

on:
  push:
  pull_request:

jobs:
  static-checks:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Python
        run: pacman -Syu --noconfirm python
      - name: Python syntax
        run: >-
          python -m py_compile
          bottles-retro-cd-gui.py
          bottles-retro-cd-gui-base.py
          bottles-retro-cd-gui-lifecycle.py
          bottles-retro-cd-gui-dgvoodoo.py
          bottles_storage.py
          cdemu_backend.py
          cdemu_lifecycle.py
          cdemu_lifecycle_cli.py
          cdemu_update_cli.py
          dgvoodoo_backend.py
          dgvoodoo_cli.py
          dgvoodoo_policy.py
          dgvoodoo_probe.py
          dgvoodoo_state.py
          dgvoodoo_wine.py
          disc_bridge.py
          disc_sets_backend.py
          gpu_backend.py
          multidisc_backend.py
          protection_scanner.py
          retro_optical.py
          sandbox_backend.py
          settings_backend.py
          verifier_backend.py
          verifier_catalog.py
          verifier_cli.py
          verifier_common.py
          verifier_hash.py
          verifier_updates.py
      - name: Unit tests
        env:
          PYTHONWARNINGS: error::ResourceWarning
        run: python -m unittest discover -s tests -v
      - name: Shell syntax
        run: bash -n run-local.sh
      - name: Unsafe dynamic execution scan
        run: >-
          ! grep -RInE --include='*.py'
          '(^|[^A-Za-z0-9_])(os\.system|eval|exec)\s*\(|shell\s*=\s*True'
          . --exclude-dir=.git
