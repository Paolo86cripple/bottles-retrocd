name: CI

on:
  push:
  pull_request:

jobs:
  static-checks:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Python
        run: pacman -Syu --noconfirm python
      - name: Python syntax
        run: >-
          python -m py_compile
          bottles-retro-cd-gui.py
          bottles-retro-cd-gui-base.py
          bottles-retro-cd-gui-lifecycle.py
          bottles-retro-cd-gui-gamepad.py
          bottles-retro-cd-gui-hardening.py
          bottles-retro-cd-gui-runtime-audit.py
          cdemu_backend.py
          cdemu_lifecycle.py
          cdemu_lifecycle_cli.py
          cdemu_ownership.py
          cdemu_update_cli.py
          disc_bridge.py
          disc_sets_backend.py
          display_backend.py
          gamepad_backend.py
          gamepad_hotplug.py
          gamepad_ns_entry.py
          gamepad_ns_helper.py
          gpu_backend.py
          multidisc_backend.py
          protection_scanner.py
          retro_optical.py
          runtime_bus_audit.py
          runtime_surface_audit.py
          sandbox_backend.py
          settings_backend.py
          verifier_backend.py
          verifier_catalog.py
          verifier_cli.py
          verifier_common.py
          verifier_hash.py
          verifier_sandbox.py
          verifier_updater_sandbox.py
          verifier_updater_worker.py
          verifier_updates.py
          verifier_worker.py
      - name: Unit tests
        env:
          PYTHONWARNINGS: error::ResourceWarning
        run: python -m unittest discover -s tests -v
      - name: Shell syntax
        run: bash -n run-local.sh
      - name: Arch packaging syntax
        run: |
          bash -n packaging/arch/PKGBUILD packaging/arch/bottles-retrocd.install
          sh -n packaging/arch/bottles-retrocd-launcher
      - name: Release identity and Arch metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import xml.etree.ElementTree as ET

          root = Path('packaging/arch')
          desktop = (root / 'io.github.Paolo86cripple.BottlesRetroCD.desktop').read_text(encoding='utf-8')
          for required in (
              'Type=Application',
              'Name=Bottles RetroCD',
              'Exec=bottles-retrocd',
              'TryExec=bottles-retrocd',
              'Terminal=false',
          ):
              if required not in desktop:
                  raise SystemExit(f'missing desktop key: {required}')

          tree = ET.parse(root / 'io.github.Paolo86cripple.BottlesRetroCD.metainfo.xml')
          component = tree.getroot()
          if component.findtext('id') != 'io.github.Paolo86cripple.BottlesRetroCD':
              raise SystemExit('unexpected AppStream component id')
          if component.findtext('project_license') != 'GPL-3.0-or-later':
              raise SystemExit('unexpected project license')

          final_entry = Path('bottles-retro-cd-gui-gamepad.py').read_text(encoding='utf-8')
          for required in (
              '_release_base.APP_ID = "io.github.Paolo86cripple.BottlesRetroCD"',
              '_release_base.APP_NAME = "Bottles RetroCD"',
              '_release_base.VERSION = "0.4.0"',
          ):
              if required not in final_entry:
                  raise SystemExit(f'missing final release identity: {required}')

          local_entry = Path('run-local.sh').read_text(encoding='utf-8')
          if 'bottles-retro-cd-gui-runtime-audit.py' not in local_entry:
              raise SystemExit('run-local.sh does not use the current hardening runtime-audit entrypoint')

          expected = {
              'bottles-retrocd-launcher': '0ea1cd6d1a8ecf4ce90e97ac67ec1fe629c579bcfb8000f8d0be7d0433a05c39',
              'io.github.Paolo86cripple.BottlesRetroCD.desktop': 'a1076b9bab5d8279e24f397a05e45094b004c791d5aa118d3ac38c84995c872f',
              'io.github.Paolo86cripple.BottlesRetroCD.metainfo.xml': 'c6c8a1619bfc4cb150b41aa6574d12c9f5572b917edea03161ca023f6c29a4c0',
          }
          for name, digest in expected.items():
              actual = hashlib.sha256((root / name).read_bytes()).hexdigest()
              if actual != digest:
                  raise SystemExit(f'sha256 mismatch for {name}: {actual}')

          srcinfo = (root / '.SRCINFO').read_text(encoding='utf-8')
          for required in (
              '\tpkgver = 0.4.0',
              '\tpkgrel = 3',
              '\tconflicts = bottles-retro-cd-gui',
              '\treplaces = bottles-retro-cd-gui',
              '\tsource = bottles-retrocd::git+https://github.com/Paolo86cripple/bottles-retrocd.git#commit=122460692d0c19650d663a77288b1c489851cd44',
          ):
              if required not in srcinfo:
                  raise SystemExit(f'missing .SRCINFO metadata: {required}')
          PY
      - name: Unsafe dynamic execution scan
        run: >-
          ! grep -RInE --include='*.py'
          '(^|[^A-Za-z0-9_])(os\.system|eval|exec)\s*\(|shell\s*=\s*True'
          . --exclude-dir=.git
